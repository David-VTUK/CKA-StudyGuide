site_name: CKA-Studyguide 
theme:
  name: material
  features:
    - navigation.expand
  palette:

    # Palette toggle for automatic mode
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode

    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default 
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to system preference

docs_dir: cka-study-guide/docs

nav:
  - Home: 'index.md'
  - 'Revision Topics':
      - 'Part One - Storage':
          - "Overview": "revision-topics/01-storage/overview.md" 
          - "Implement storage classes and dynamic volume provisioning": "revision-topics/01-storage/part-1.md"
          - "Configure volume types, access modes and reclaim policies": "revision-topics/01-storage/part-2.md"
          - "Manage persistent volumes and persistent volume claims": "revision-topics/01-storage/part-3.md"
      - 'Part Two - Troubleshooting':
          - "Overview": "revision-topics/02-troubleshooting/overview.md"
          - "Troubleshoot clusters and nodes": "revision-topics/02-troubleshooting/part-1.md"
          - "Troubleshoot cluster components": "revision-topics/02-troubleshooting/part-2.md"
          - "Monitor cluster and application resource usage": "revision-topics/02-troubleshooting/part-3.md"
          - "Manage and evaluate container output streams": "revision-topics/02-troubleshooting/part-4.md"
          - "Troubleshoot services and networking": "revision-topics/02-troubleshooting/part-5.md"

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - tables
  - attr_list

extra_css:
  - custom.css